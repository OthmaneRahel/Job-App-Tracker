spring.application.name=service-candidatures

spring.config.import= configserver:http://localhost:8888ad

# services
services.utilisateurs.url=http://localhost:8082

# spring cloud openfeign
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.circuitbreaker.group.enabled=true
spring.cloud.openfeign.client.config.default.connectTimeout=2000
spring.cloud.openfeign.client.config.default.readTimeout=5000
spring.cloud.openfeign.client.config.default.loggerLevel=basic

# logging
logging.level.jobtrackerapp.servicecandidatures.client=DEBUG


spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis


# ==============================
# Resilience4j - Circuit Breaker
# ==============================
#resilience4j.circuitbreaker.configs.default.slidingWindowType=COUNT_BASED
#resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
#resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
#resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
#resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10s
#resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
#resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true


resilience4j.circuitbreaker.instances.utilisateur-circuit.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.utilisateur-circuit.sliding-window-size=10
resilience4j.circuitbreaker.instances.utilisateur-circuit.wait-duration-in-open-state=10s

# Exceptions ignorées
resilience4j.circuitbreaker.configs.default.ignoreExceptions[0]=jobtrackerapp.servicecandidatures.Exception.ResourceNotFoundException

# Instance Circuit Breaker
resilience4j.circuitbreaker.instances.service-utilisateurs.baseConfig=default

# ==============================
# Resilience4j - TimeLimiter
# ==============================
resilience4j.timelimiter.configs.default.timeoutDuration=6s

# ==============================
# Actuator - Monitoring
# ==============================
management.endpoints.web.exposure.include=health,circuitbreakers
management.health.circuitbreakers.enabled=true